<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader - Modern & Hızlı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root {
      --primary: #FF0000;
      --primary-glow: rgba(255, 0, 0, 0.5);
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 40px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: translateY(-5px);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(to right, #ffffff, #ff416c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .input-group {
      margin-bottom: 25px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 18px 25px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .option-card {
      flex: 1;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .option-card.active {
      background: rgba(255, 65, 108, 0.2);
      border-color: #ff416c;
      box-shadow: 0 0 20px rgba(255, 65, 108, 0.3);
    }

    .option-card h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .option-card span {
      font-size: 0.8rem;
      opacity: 0.6;
    }

    .download-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
    }

    .download-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 30px rgba(255, 65, 108, 0.6);
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    .download-btn:disabled {
      background: #444;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 20px;
      font-size: 0.9rem;
      min-height: 20px;
      transition: all 0.3s ease;
    }

    .loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Decorative blobs */
    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
      opacity: 0.4;
      animation: move 20s infinite alternate;
    }

    .blob-1 {
      top: -100px;
      right: -100px;
      background: #ff416c;
    }

    .blob-2 {
      bottom: -150px;
      left: -150px;
      background: #302b63;
    }

    @keyframes move {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(50px, 100px);
      }
    }
  </style>
</head>

<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <h1>YouTube Video Downloader</h1>
    <p>Hızlı ve yüksek kaliteli indirme deneyimi</p>

    <div class="input-group">
      <input type="text" id="videoUrl" placeholder="YouTube video linkini buraya yapıştırın..." autocomplete="off">
    </div>

    <div class="options">
      <div class="option-card active" data-format="video" onclick="setFormat('video')">
        <h3>Video</h3>
        <span>MP4 format (HD)</span>
      </div>
      <div class="option-card" data-format="audio" onclick="setFormat('audio')">
        <h3>Ses</h3>
        <span>MP3 format (Yüksek Kalite)</span>
      </div>
    </div>

    <button class="download-btn" id="downloadBtn" onclick="handleDownload()">İndir</button>

    <div class="status" id="status">
      <div class="loader" id="loader"></div>
      <div id="statusText"></div>
    </div>
  </div>

  <script>
    let currentFormat = 'video';

    function setFormat(format) {
      currentFormat = format;
      document.querySelectorAll('.option-card').forEach(card => {
        card.classList.remove('active');
        if (card.dataset.format === format) {
          card.classList.add('active');
        }
      });
    }

    async function handleDownload() {
      const urlInput = document.getElementById('videoUrl');
      const url = urlInput.value.trim();
      const btn = document.getElementById('downloadBtn');
      const statusText = document.getElementById('statusText');
      const loader = document.getElementById('loader');

      if (!url) {
        Swal.fire({
          icon: 'warning',
          title: 'Uyarı',
          text: 'Lütfen bir URL girin',
          confirmButtonColor: '#ff416c'
        });
        return;
      }

      // Simple YouTube URL validation
      if (!url.includes('youtube.com/') && !url.includes('youtu.be/')) {
        Swal.fire({
          icon: 'error',
          title: 'Hata',
          text: 'Lütfen geçerli bir YouTube linki girin',
          confirmButtonColor: '#ff416c'
        });
        return;
      }

      btn.disabled = true;
      loader.style.display = 'block';
      statusText.innerText = 'Video işleniyor, lütfen bekleyin...';
      statusText.style.color = 'white';

      try {
        const formData = new FormData();
        formData.append('url', url);
        formData.append('format', currentFormat);

        const response = await fetch('api/download.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          statusText.innerText = 'İndirme başlıyor!';
          statusText.style.color = '#00ff00';

          // Trigger download
          window.location.href = data.downloadUrl;
        } else {
          statusText.innerText = 'Hata: ' + (data.error || 'Bilinmeyen bir hata oluştu');
          statusText.style.color = '#ff416c';
          console.error('Download error:', data.details);
        }
      } catch (error) {
        statusText.innerText = 'Hata: Sunucuya ulaşılamadı';
        statusText.style.color = '#ff416c';
        console.error('Fetch error:', error);
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }
  </script>
</body>

</html>
